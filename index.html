<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <h1 class="logo">♫</h1>

        <nav class="menu">

            <ul>

                <li>
                    <a href="#">Home</a>
                </li>

                <li>
                    <a href="#">Pesquisar</a>
                </li>

                <li>
                    <a href="#">Biblioteca</a>
                </li>

            </ul>

        </nav>

    </aside>

    <!-- CONTEÚDO -->
    <main class="main-content">

        <!-- BUSCA -->
        <div class="search-bar">

            <input
                type="text"
                placeholder="Buscar músicas..."
                id="inputBusca"
            >

            <button id="btnBuscar">
                🔍
            </button>

        </div>

        <!-- TÍTULO -->
        <div class="header">

            <h2>Músicas populares</h2>

        </div>

        <!-- CARDS -->
        <section class="cards">

        </section>

    </main>

    <!-- PLAYER FIXO -->
    <footer class="player">

        <div class="music-info">

            <strong id="nomeMusica">
                Nenhuma música
            </strong>

            <p id="nomeArtista">
                Escolha uma música
            </p>

        </div>
          <footer class="player">
          <div class="music-info">
          <strong>Música atual</strong>
          <p>Artista</p>
        </div>
  
        <div class="controls">
          <button><img src="./img/play1.png" alt=""></button>
          <button><img src="./img/play.svg" alt=""></button>
          <button><img src="./img/play2.png" alt=""></button>
        </div>

        <div class="time">
        00:00 / 03:30
    </footer>

    <script src="app.js"></script>

</body>

</html>
