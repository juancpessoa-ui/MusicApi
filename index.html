
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music App</title>

  <!-- CSS externo -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h1 class="logo"> Musica</h1>

    <nav class="menu">
      <ul>
        <li><a href="#">
          <img src="./img/lupa.svg" alt="lupa">
          Buscar
        </a>
        <li>
          <a href="#">
            <img src="./img/home.svg" alt="home">
            Home
          </a>
        </li>
        
        <li>
          <a href="#">
            <img src="./img/book.svg" alt="biblioteca">
            Sua Biblioteca
          </a>
        </li>
        
        <li>
          <a href="#">
            <img src="./img/mais.svg" alt="liked songs">
            Liked Songs
          </a>
        </li>
        <hr>
      </ul>
    </nav>

    <div class="playlist-section">
  
      <ul>
        <li><a href="#">My Favorites</a></li>
        <li><a href="#">Chill Vibes</a></li>
        <li><a href="#">Treino</a></li>

      </ul>
    </div>
  </aside>

  

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="main-content">

    <!-- HEADER -->
    <div class="search-bar">
      <h1>Seus álbuns e artistas favoritos </h1>
      
      </div>
      

    <!-- GRID DE CARDS -->
    <section class="cards">

      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Capa">
        <h4>Playlist 1</h4>
        <p>As melhores músicas</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Capa">
        <h4>Playlist 2</h4>
        <p>Hits do momento</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Capa">
        <h4>Playlist 3</h4>
        <p>Relax e foco</p>
      </div>

      <div class="card">
        <img src="https://via.placeholder.com/150" alt="Capa">
        <h4>Playlist 4</h4>
        <p>Top global</p>
      </div>

    </section>

  </main>

  <!-- PLAYER FIXO -->
  <footer class="player">

    <div class="music-info">
      <strong>Música atual</strong>
      <p>Artista</p>
    </div>
    
    <div class="controls">
      
      <button><img src="./img/play1.png" alt=""></button>
      <button><img src="./img/play.svg" alt=""></button>
      <button><img src="./img/play2.png" alt=""></button>
      
      
    </div>
  
    <div class="time">
      00:00 / 03:30
    

  </footer>

</body>
</html>
